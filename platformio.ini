; LightBox — PlatformIO 設定 (CH32V003 / ch32fun)
;
; ★この環境では PlatformIO 未検証。検証済みビルドは source/Makefile (README ①)。
;   ch32fun は PlatformIO 公式フレームワークではないため、ここでは
;   「コミュニティ platform-ch32v のツールチェインで ch32fun をベアビルド」する構成。
;   詳細と前提は PLATFORMIO.md を参照。
;
; 前提:
;   1) ch32fun をプロジェクト直下 ./ch32fun に配置 (git clone or symlink)。
;      例: git clone https://github.com/cnlohr/ch32fun ch32fun
;   2) リンカスクリプトは同梱の ldscript/lightbox_ch32v003.ld を使用(前処理済)。
;   3) 書込は WCH-LinkE (minichlink)。PlatformIO の upload は環境依存。

[platformio]
src_dir = source
default_envs = ch32v003

[env:ch32v003]
platform = https://github.com/Community-PIO-CH32V/platform-ch32v.git
board = genericCH32V003F4P6
; フレームワークを使わずベアビルド(ch32fun.c が起動/ベクタを提供)
build_src_filter =
    +<*.c>
    +<../ch32fun/ch32fun/ch32fun.c>

build_flags =
    -DCH32V003=1
    -march=rv32ec
    -mabi=ilp32e
    -Os -flto -ffunction-sections -fdata-sections
    -Isource
    -Ich32fun/ch32fun
    -Ich32fun/extralibs
    -nostdlib
    -Wl,--gc-sections
    -T ${platformio.workspace_dir}/../ldscript/lightbox_ch32v003.ld

; 依存: RV32EC の libgcc を持つツールチェイン(xpack riscv-none-elf)。
; platform-ch32v 同梱ツールチェインで rv32ec が無い場合は
;   platform_packages = toolchain-riscv @ file:///C:/Users/<you>/AppData/Local/xpack-riscv-none-elf-gcc/...
; のように xpack を差し込む(PLATFORMIO.md 参照)。
